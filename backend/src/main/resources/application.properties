# ===================================================
# Application Configuration
# ===================================================
server.port=8080
spring.application.name=student-registration-app

# ===================================================
# Database Configuration (H2 Embedded Database)
# ===================================================
# Persistent file-based H2 database (data stored in ./data/studentdb)
spring.datasource.url=jdbc:h2:file:./data/studentdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console Configuration
# Accessible at: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=true

# ===================================================
# Spring Data JPA / Hibernate Configuration
# ===================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================
# Thymeleaf Template Configuration
# ===================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

